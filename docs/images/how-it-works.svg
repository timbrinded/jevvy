<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="948" viewBox="0 0 1600 948" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">jevvy — from comment intent to inspectable evidence</title>
  <desc id="desc">A six-step architecture diagram. Capture source from files or Git changes; prepare comments and local context with AST parsing; send fixed questions to Jev through the TypeSafe API; validate native answers; store a frozen results bundle; let Pi interpret the evidence. An illustrative comment promises undefined while its function throws. The example result identifies that contradiction without inventing probabilities. Dry-run prepares requests without inference; valid cached answers can be reused.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1600" y2="948" gradientUnits="userSpaceOnUse"><stop stop-color="#171d24"/><stop offset=".54" stop-color="#0e131a"/><stop offset="1" stop-color="#151b22"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#232b35"/><stop offset="1" stop-color="#19212a"/></linearGradient>
    <linearGradient id="core" x1="690" y1="534" x2="860" y2="710" gradientUnits="userSpaceOnUse"><stop stop-color="#ffe4b9"/><stop offset=".46" stop-color="#ffb86d"/><stop offset="1" stop-color="#e87845"/></linearGradient>
    <linearGradient id="wire" x1="490" y1="470" x2="1120" y2="800" gradientUnits="userSpaceOnUse"><stop stop-color="#799488"/><stop offset=".48" stop-color="#f5bc82"/><stop offset="1" stop-color="#a5dbc6"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#ed9659" stop-opacity=".17"/><stop offset=".6" stop-color="#ed9659" stop-opacity=".04"/><stop offset="1" stop-color="#ed9659" stop-opacity="0"/></radialGradient>
    <radialGradient id="wash"><stop stop-color="#83bea8" stop-opacity=".09"/><stop offset="1" stop-color="#83bea8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#9ba9b6" opacity=".16"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".24"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" stroke="#accbbc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <clipPath id="frame"><rect x="1" y="1" width="1598" height="946" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="948" fill="url(#canvas)"/>
    <rect y="316" width="1600" height="614" fill="url(#grid)"/>
    <ellipse cx="780" cy="606" rx="360" ry="350" fill="url(#aura)"/>
    <ellipse cx="1390" cy="620" rx="400" ry="440" fill="url(#wash)"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <!-- Identity and editorial headline -->
      <g transform="translate(68 62)" stroke="#c6e7d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 7h12v18c0 10-6 15-14 15"/><path d="m21 8 11 11-11 11"/></g>
      <text x="117" y="99" font-size="42" font-weight="650" letter-spacing="-2" fill="#f0f3ee">jevvy</text>
      <text x="68" y="192" font-size="66" font-weight="600" letter-spacing="-2.8" fill="#f1f2ed">From source comments</text>
      <text x="68" y="266" font-size="66" font-weight="600" letter-spacing="-2.8" fill="#aecbbd">to reviewable evidence.</text>
      <path d="M68 312H1532" stroke="#36404b"/>

      <!-- The continuous path connects source preparation, inference and validation. -->
      <g stroke="url(#wire)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
        <path d="M488 547h25q27 0 27-27v-57q0-22 22-22h18"/>
        <path d="M784 490v38"/>
        <path d="M784 730v48"/>
        <path d="M988 826h42q27 0 27-27V596q0-28 28-28h29"/>
        <path d="M1324 754v40"/>
      </g>
      <g fill="#d7e7d6"><circle cx="519" cy="545" r="3"/><circle cx="784" cy="507" r="3"/><circle cx="1057" cy="704" r="3"/></g>
      <g fill="#e6b780"><circle cx="784" cy="754" r="3"/><circle cx="540" cy="489" r="3"/></g>

      <!-- Source: an inspectable, deliberately contradictory example. -->
      <text x="85" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#bcd5c6">01</text>
      <text x="116" y="371" font-size="26" font-weight="550" fill="#e7ece7">Capture source</text>
      <g filter="url(#shadow)">
        <rect x="78" y="423" width="410" height="290" rx="14" fill="#121b23" stroke="#34434d" transform="rotate(-3 283 568)"/>
        <rect x="68" y="410" width="420" height="294" rx="14" fill="url(#panel)" stroke="#4a5660"/>
      </g>
      <path d="M69 464h418" stroke="#3b4651"/>
      <g fill="#58646e"><circle cx="92" cy="438" r="4"/><circle cx="108" cy="438" r="4"/><circle cx="124" cy="438" r="4"/></g>
      <text x="149" y="445" font-size="18" font-family="'SFMono-Regular', Consolas, monospace" fill="#d4dce1">lookup.ts</text>
      <text x="467" y="444" text-anchor="end" font-size="12" letter-spacing="1.7" fill="#9aa8b3">EXAMPLE</text>
      <rect x="84" y="566" width="388" height="39" rx="5" fill="#d18c52" opacity=".1"/>
      <path d="M85 568v35" stroke="#dca369" stroke-width="2"/>
      <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="20">
        <g fill="#6d7d89" text-anchor="end"><text x="110" y="510">1</text><text x="110" y="551">2</text><text x="110" y="592">3</text><text x="110" y="633">4</text></g>
        <text x="128" y="510" fill="#acd1b9">// Returns undefined.</text>
        <text x="128" y="551" fill="#dce3e7"><tspan fill="#c0aedb">function</tspan> lookup() {</text>
        <text x="128" y="592" fill="#dce3e7">  throw Error(<tspan fill="#e9ba8b">"Missing"</tspan>);</text>
        <text x="128" y="633" fill="#dce3e7">}</text>
      </g>
      <text x="92" y="681" font-size="16" fill="#91a1af">Files · working tree · branch comparison</text>

      <!-- Deterministic preparation and the single inference boundary. -->
      <rect x="580" y="402" width="408" height="88" rx="14" fill="url(#panel)" stroke="#48544d"/>
      <text x="602" y="434" font-size="14" letter-spacing="1.4" fill="#a9c0b2">02 / PREPARE LOCALLY</text>
      <text x="602" y="468" font-size="21" font-weight="500" fill="#e3e9e3">Extract comments and local context</text>
      <text x="784" y="558" text-anchor="middle" font-size="13" letter-spacing="2.2" fill="#d6b58e">03 / TYPESAFE API</text>
      <circle cx="784" cy="640" r="112" stroke="#e5ab73" stroke-opacity=".17"/>
      <circle cx="784" cy="640" r="97" stroke="#e5ab73" stroke-opacity=".35" stroke-dasharray="1 9" stroke-linecap="round"/>
      <path d="M674 620a112 112 0 0 1 29-55M865 718a112 112 0 0 1-45 29" stroke="#ebbb87" stroke-width="2" stroke-linecap="round"/>
      <circle cx="784" cy="640" r="81" fill="#e99f64" opacity=".25" filter="url(#glow)"/>
      <circle cx="784" cy="640" r="77" fill="url(#core)" stroke="#ffe4b9" stroke-opacity=".7"/>
      <path d="M740 603q44-27 87 0" stroke="#fff2d6" stroke-opacity=".45" stroke-linecap="round"/>
      <text x="784" y="651" text-anchor="middle" font-size="49" font-weight="650" letter-spacing="-2" fill="#372319">Jev</text>
      <text x="784" y="680" text-anchor="middle" font-size="15" font-weight="600" fill="#5b3826">14 fixed labels</text>
      <rect x="580" y="786" width="408" height="80" rx="14" fill="url(#panel)" stroke="#48544d"/>
      <text x="602" y="816" font-size="14" letter-spacing="1.4" fill="#a9c0b2">04 / VALIDATE LOCALLY</text>
      <text x="602" y="847" font-size="21" fill="#e3e9e3">Check types, IDs and distributions</text>

      <!-- Retained evidence, followed by the actual interpretation owner. -->
      <text x="1133" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#bcd5c6">05</text>
      <text x="1164" y="371" font-size="26" font-weight="550" fill="#e7ece7">Retain evidence</text>
      <g filter="url(#shadow)"><rect x="1116" y="410" width="416" height="344" rx="14" fill="url(#panel)" stroke="#547163"/></g>
      <path d="M1117 464h414" stroke="#3e5149"/>
      <g transform="translate(1139 427)" stroke="#b2cfbe" stroke-width="1.5" stroke-linejoin="round"><path d="M0 0h12l5 5v17H0Z"/><path d="M12 0v6h5"/><path d="M4 11h9M4 16h7"/></g>
      <text x="1171" y="445" font-family="'SFMono-Regular', Consolas, monospace" font-size="19" fill="#dce8de">results.bundle</text>
      <text x="1510" y="444" text-anchor="end" font-size="12" letter-spacing="1.7" fill="#9aa8b3">EXAMPLE</text>
      <text x="1140" y="502" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" fill="#b7c4ce">lookup.ts:1</text>
      <text x="1140" y="537" font-size="20" fill="#e8ede8">Local consistency</text>
      <text x="1140" y="579" font-size="23" font-weight="500" fill="#f1c99e">Contradicted</text>
      <text x="1140" y="624" font-size="17" fill="#a9b9b2">Original context and answers</text>
      <path d="M1140 644h368" stroke="#3a454e"/>
      <g font-size="17" fill="#c6d6cb"><text x="1140" y="676">Source references</text><text x="1140" y="707">Model and request details</text></g>
      <g stroke="#a6cdb6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m1491 669 5 5 9-10"/><path d="m1491 700 5 5 9-10"/></g>
      <rect x="1116" y="804" width="416" height="86" rx="14" fill="#20332d" stroke="#4d6b5b"/>
      <text x="1139" y="836" font-size="14" letter-spacing="1.4" fill="#a9c9b5">06 / PI INTERPRETS</text>
      <text x="1139" y="868" font-size="23" font-weight="500" fill="#dcebe0">Review results in context.</text>

    </g>
  </g>
  <rect x=".5" y=".5" width="1599" height="947" rx="28" stroke="#45515b" stroke-opacity=".65"/>
</svg>
