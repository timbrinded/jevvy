<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Jevvy: source to reviewable evidence</title>
  <desc id="desc">Comments, Functions and Tests share a review pipeline. Jevvy captures files or Git changes and prepares source units and context locally. Live requests send selected units, bound context and fixed pack questions to Jev through the TypeSafe API. Jevvy validates returned answers and saves them with the source snapshot and question definitions. Pi and the reviewer inspect the evidence before recommending changes. Dry runs prepare requests without inference; valid cached answers can be reused. Scans leave source files unchanged.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18222a"/><stop offset="1" stop-color="#10171e"/>
    </linearGradient>
    <linearGradient id="jev" x1="430" y1="236" x2="770" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b3028"/><stop offset="1" stop-color="#292624"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="m2 2 4 3-4 3" stroke="#b5d9c8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .heading { font-size: 28px; font-weight: 600; fill: #eef3ed; }
      .body { font-size: 22px; fill: #bdcbd1; }
      .eyebrow { font-size: 19px; font-weight: 600; letter-spacing: 1px; fill: #a6cdb9; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="678" rx="24" fill="url(#canvas)" stroke="#3c4b54"/>
  <g stroke="#b5d9c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(48 38)">
    <path d="M0 3h11v17c0 8-5 12-12 12"/><path d="m21 4 9 9-9 9"/>
  </g>
  <text x="96" y="66" font-size="32" font-weight="650" letter-spacing="-1" fill="#eef3ed">jevvy</text>
  <text x="48" y="131" font-size="46" font-weight="600" letter-spacing="-1.5" fill="#eef3ed">Code review with its evidence attached.</text>
  <g font-size="21" font-weight="500">
    <rect x="48" y="163" width="160" height="42" rx="21" fill="#273a33" stroke="#526e60"/>
    <text x="128" y="191" text-anchor="middle" fill="#cee4d7">Comments</text>
    <rect x="224" y="163" width="160" height="42" rx="21" fill="#273a33" stroke="#526e60"/>
    <text x="304" y="191" text-anchor="middle" fill="#cee4d7">Functions</text>
    <rect x="400" y="163" width="124" height="42" rx="21" fill="#273a33" stroke="#526e60"/>
    <text x="462" y="191" text-anchor="middle" fill="#cee4d7">Tests</text>
  </g>
  <text x="1152" y="191" text-anchor="end" font-size="21" fill="#99acb5">One workflow · pack-specific questions</text>

  <rect x="48" y="236" width="336" height="244" rx="16" fill="#1e2b33" stroke="#435963"/>
  <text x="72" y="273" class="eyebrow">01 / LOCAL PREPARATION</text>
  <text x="72" y="321" class="heading">Capture &amp; extract</text>
  <text x="72" y="365" class="body">Files or Git changes</text>
  <text x="72" y="401" class="body">Selected source units</text>
  <text x="72" y="437" class="body">Local + explicit context</text>

  <path d="M389 358h34" stroke="#b5d9c8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="430" y="236" width="340" height="244" rx="16" fill="url(#jev)" stroke="#937252"/>
  <text x="454" y="273" class="eyebrow" style="fill:#edbd8e">02 / TYPESAFE API</text>
  <text x="454" y="321" class="heading" style="fill:#ffddb9">Assess with Jev</text>
  <text x="454" y="365" class="body">Selected units + context</text>
  <text x="454" y="401" class="body">Fixed pack questions</text>
  <text x="454" y="437" class="body">Answers + distributions</text>

  <path d="M775 358h34" stroke="#b5d9c8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="816" y="236" width="336" height="244" rx="16" fill="#1e2b33" stroke="#435963"/>
  <text x="840" y="273" class="eyebrow">03 / LOCAL RESULTS</text>
  <text x="840" y="321" class="heading">Validate &amp; save</text>
  <text x="840" y="365" class="body">Captured source files</text>
  <text x="840" y="401" class="body">Question definitions</text>
  <text x="840" y="437" class="body">Answers + processing gaps</text>

  <path d="M984 484v26" stroke="#b5d9c8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="520" width="1104" height="100" rx="16" fill="#233930" stroke="#536f60"/>
  <text x="72" y="559" class="eyebrow">04 / PI + YOU</text>
  <text x="72" y="597" font-size="27" font-weight="500" fill="#e2eee5">Inspect the saved evidence, then decide what to change.</text>
  <g transform="translate(1079 547)" stroke="#b5d9c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="37" height="46" rx="4"/><path d="M9 12h19M9 22h19M9 32h11"/>
  </g>
  <text x="48" y="655" font-size="20" fill="#a5b8c0">Dry run: prepare only. Cached answers: reuse after validation. Source files stay unchanged.</text>
</svg>
